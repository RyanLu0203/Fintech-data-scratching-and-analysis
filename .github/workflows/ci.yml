name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest -q
      - run: python scripts/run_coursework.py --mode smoke
      - run: python scripts/validate_saved_evidence.py
